[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "farmmate"
version = "1.0.0"
description = "FarmMate - Agricultural Intelligence Platform"
authors = [{ name = "FarmMate Team" }]
dependencies = [
    "streamlit",
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "catboost",
    "joblib",
    "plotly",
    "folium",
    "streamlit-folium",
    "requests",
    "python-dotenv",
    "pytz"
]
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
