<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flow-reverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 40; }
      }
      .path {
        stroke: #3b82f6;
        stroke-width: 3;
        fill: none;
        stroke-dasharray: 10 10;
        animation: flow 1s linear infinite;
      }
      .path-bidir {
        stroke: #10b981;
        stroke-width: 3;
        fill: none;
        stroke-dasharray: 10 10;
        animation: flow-reverse 1s linear infinite;
      }
      .box { fill: #1e293b; stroke: #475569; stroke-width: 2; rx: 8; ry: 8; }
      .box:hover { stroke: #3b82f6; fill: #0f172a; transition: 0.3s; cursor: pointer; }
      .container { fill: rgba(30,41,59,0.3); stroke: #334155; stroke-dasharray: 5 5; stroke-width: 2; rx: 12; ry: 12; }
      .text-title { fill: #e2e8f0; font-family: sans-serif; font-size: 18px; font-weight: bold; }
      .text-label { fill: #94a3b8; font-family: sans-serif; font-size: 14px; text-anchor: middle; font-weight: bold; pointer-events: none; }
      .text-sub { fill: #64748b; font-family: sans-serif; font-size: 12px; text-anchor: middle; pointer-events: none; }
      
      .glow { filter: drop-shadow(0 0 8px rgba(59,130,246,0.6)); }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" />
  
  <!-- Containers -->
  <!-- Client Tier -->
  <rect x="50" y="50" width="900" height="130" class="container" />
  <text x="70" y="80" class="text-title">🌐 Client Tier (React 19 + TypeScript)</text>

  <!-- API Tier -->
  <rect x="50" y="230" width="420" height="230" class="container" />
  <text x="70" y="260" class="text-title">⚡ API Gateway (FastAPI)</text>

  <!-- ML Tier -->
  <rect x="530" y="230" width="420" height="230" class="container" />
  <text x="550" y="260" class="text-title">🧠 ML &amp; Agronomic Engine</text>

  <!-- External -->
  <rect x="50" y="510" width="900" height="130" class="container" />
  <text x="70" y="540" class="text-title">🔌 External Integrations</text>

  <!-- Animated Paths -->
  <!-- UI to Router -->
  <path d="M 170 150 L 170 290" class="path" />
  <path d="M 380 150 L 380 290" class="path" />
  
  <!-- Router to Cache -->
  <path d="M 260 340 L 260 370" class="path-bidir" />
  
  <!-- Router to Engine -->
  <path d="M 440 315 L 560 315" class="path" />
  
  <!-- Router to Groq -->
  <!-- Out from left side of Router, down to Groq -->
  <path d="M 80 315 L 30 315 L 30 530 L 170 530 L 170 560" class="path-bidir" />
  
  <!-- Cache to Redis -->
  <path d="M 260 420 L 260 490 L 380 490 L 380 560" class="path-bidir" />
  
  <!-- Engine to ONNX -->
  <path d="M 740 340 L 740 370" class="path" />
  
  <!-- Engine (Services) to OWM -->
  <!-- Out from left side of Services, down to OWM -->
  <path d="M 560 315 L 500 315 L 500 480 L 590 480 L 590 560" class="path" />
  
  <!-- ONNX to ModelStore -->
  <path d="M 740 420 L 740 490 L 800 490 L 800 560" class="path" />

  <!-- Nodes Client -->
  <rect x="80" y="100" width="180" height="50" class="box glow" />
  <text x="170" y="122" class="text-label">UI Dashboard</text>
  <text x="170" y="140" class="text-sub">Tailwind CSS</text>

  <rect x="290" y="100" width="180" height="50" class="box" />
  <text x="380" y="122" class="text-label">FarmContext</text>
  <text x="380" y="140" class="text-sub">React State</text>

  <rect x="500" y="100" width="180" height="50" class="box" />
  <text x="590" y="122" class="text-label">GIS Map</text>
  <text x="590" y="140" class="text-sub">Leaflet</text>

  <rect x="710" y="100" width="180" height="50" class="box" />
  <text x="800" y="122" class="text-label">FarmScene</text>
  <text x="800" y="140" class="text-sub">SVG Animations</text>

  <!-- Nodes API -->
  <rect x="80" y="290" width="360" height="50" class="box glow" />
  <text x="260" y="312" class="text-label">FastAPI REST Router</text>
  <text x="260" y="330" class="text-sub">/api endpoints</text>

  <rect x="80" y="370" width="360" height="50" class="box" />
  <text x="260" y="392" class="text-label">Redis Cache Manager</text>
  <text x="260" y="410" class="text-sub">TTL Management</text>

  <!-- Nodes Engine -->
  <rect x="560" y="290" width="360" height="50" class="box glow" />
  <text x="740" y="312" class="text-label">Agronomic Services</text>
  <text x="740" y="330" class="text-sub">Crop, Yield, ET0</text>

  <rect x="560" y="370" width="360" height="50" class="box" />
  <text x="740" y="392" class="text-label">ONNX Engine</text>
  <text x="740" y="410" class="text-sub">Fast CPU Inference</text>

  <!-- Nodes External -->
  <rect x="80" y="560" width="180" height="50" class="box" />
  <text x="170" y="582" class="text-label">Groq AI API</text>
  <text x="170" y="600" class="text-sub">LLM Provider</text>
  
  <rect x="290" y="560" width="180" height="50" class="box glow" />
  <text x="380" y="582" class="text-label">Redis Cache DB</text>
  <text x="380" y="600" class="text-sub">Memory Store</text>

  <rect x="500" y="560" width="180" height="50" class="box" />
  <text x="590" y="582" class="text-label">OpenWeatherMap</text>
  <text x="590" y="600" class="text-sub">Telemetry API</text>

  <rect x="710" y="560" width="180" height="50" class="box" />
  <text x="800" y="582" class="text-label">Model Artifacts</text>
  <text x="800" y="600" class="text-sub">.pkl / .onnx</text>

</svg>
